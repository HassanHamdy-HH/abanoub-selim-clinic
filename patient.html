<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ملفي</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--teal:#0B3B47;--gold:#C9A24B;--bg:#EAF6F7;--ink:#1f2d33;--soft:#5b727a}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--teal);color:#fff;padding:22px 16px;text-align:center}header h1{margin:0 0 4px;font-size:1.3rem}header p{margin:0;opacity:.8;font-size:.9rem}
main{max-width:560px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(11,59,71,.08)}
h2{font-size:1rem;margin:0 0 10px;color:var(--teal)}.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e3eef0}.row:last-child{border:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:#eef6f7;color:var(--teal)}.pill.ok{background:#e3f7ea;color:#1c7a3f}.pill.w{background:#fff4d9;color:#8a6a10}
.due{font-size:1.5rem;font-weight:800;color:#c0392b}.zero{color:#1c7a3f}.hint{color:var(--soft);font-size:.82rem}
.btn{display:block;text-align:center;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;margin-top:8px}.wa{background:#25D366}.bk{background:var(--teal)}
footer{text-align:center;color:var(--soft);font-size:.75rem;padding:14px}
</style>
</head>
<body>
<header><h1 id="cn">ملفي</h1><p id="hello"></p></header>
<main id="app"><div class="card"><p class="hint">جاري التحميل…</p></div></main>
<footer><a href="privacy.html" style="color:inherit">سياسة الخصوصية</a> · Powered by VYORA</footer>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var CC = window.CLINIC_CONFIG || {};
  var FB = CC.firebase || { apiKey:"AIzaSyAXoB_WHtLStu0mr4dnZKG8YeXOn_R1dg4", authDomain:"abanoub-clinic.firebaseapp.com", projectId:"abanoub-clinic", storageBucket:"abanoub-clinic.firebasestorage.app", messagingSenderId:"904420382642", appId:"1:904420382642:web:2c048976c4d04e2d8436ab" };
  var app = document.getElementById('app');
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fail(m){ app.innerHTML = '<div class="card"><p>' + esc(m) + '</p></div>'; }
  var t = (location.search.match(/[?&]t=([A-Za-z0-9]{20,64})/) || [])[1];
  if(!t) return fail('الرابط ناقص. اطلب من العيادة تبعتلك الرابط تاني.');
  firebase.initializeApp(FB);
  firebase.firestore().collection('patientLinks').doc(t).get().then(function(d){
    if(!d.exists) return fail('الرابط ده مش شغال أو اتلغى. اطلب من العيادة رابط جديد.');
    var x = d.data();
    if(x.exp && Date.now() > x.exp) return fail('الرابط انتهت صلاحيته. اطلب من العيادة رابط جديد.');
    var cl = x.clinic || {};
    document.getElementById('cn').textContent = cl.name || 'ملفي'; document.title = 'ملفي — ' + (cl.name || '');
    document.getElementById('hello').textContent = 'أهلاً ' + (x.name || '');
    var h = '';
    var up = x.upcoming || [];
    h += '<div class="card"><h2>📅 مواعيدك الجاية</h2>' + (up.length ? up.map(function(a){ return '<div class="row"><span>' + esc(a.day) + ' — ' + esc(a.time) + '</span><span class="pill ' + (a.status === 'confirmed' ? 'ok' : 'w') + '">' + (a.status === 'confirmed' ? 'مؤكد' : 'في الانتظار') + '</span></div>'; }).join('') : '<p class="hint">مفيش مواعيد جاية.</p>') + '</div>';
    var due = +x.due || 0;
    h += '<div class="card"><h2>💰 الحساب</h2><div class="' + (due > 0 ? 'due' : 'due zero') + '">' + (due > 0 ? Math.round(due).toLocaleString('en-US') + ' جنيه متبقي' : 'مفيش مبالغ متبقية ✓') + '</div></div>';
    var vs = x.visits || [];
    if(vs.length) h += '<div class="card"><h2>🦷 آخر زياراتك</h2>' + vs.map(function(v){ return '<div class="row"><span>' + esc(v.day) + '</span><span class="hint">' + esc(v.what || '') + '</span></div>'; }).join('') + '</div>';
    var acts = '';
    if(cl.phone) acts += '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/2' + esc(String(cl.phone).replace(/\D/g, '').replace(/^0?/, '')) + '">💬 كلّم العيادة</a>';
    acts += '<a class="btn bk" href="book.html">📅 احجز ميعاد جديد</a>';
    h += '<div class="card">' + acts + '<p class="hint" style="margin-top:10px;">آخر تحديث: ' + new Date(x.ts || Date.now()).toLocaleDateString('en-GB') + '</p></div>';
    app.innerHTML = h;
  }).catch(function(){ fail('تعذر تحميل البيانات. جرّب تاني.'); });
})();
</script>
</body>
</html>
