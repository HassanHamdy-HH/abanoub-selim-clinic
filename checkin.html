<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل بيانات المريض — عيادة د. أبانوب سليم</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E7F91;--deep:#092E38;--gold:#D9A441;--gold-deep:#9E6E1F;--ivory:#FBFAF6;--ink:#0E2B30;--soft:#4A6067;--line:#DCE8E8;--pale:#E6F4F4;--err:#D64545;--ok:#249163;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--ivory);color:var(--ink);line-height:1.7;min-height:100vh;}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px;}
header{background:linear-gradient(160deg,var(--deep),var(--teal));color:#fff;text-align:center;padding:26px 16px 34px;border-radius:0 0 28px 28px;margin:0 -16px 18px;}
header img{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:#fff;}
header h1{font-family:'Tajawal',sans-serif;font-size:1.3rem;margin-top:10px;}
header p{opacity:.88;font-size:.9rem;margin-top:2px;}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:0 8px 24px -16px rgba(9,46,56,.35);}
.intro{font-size:.9rem;color:var(--soft);margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px;}
.field label small{font-weight:400;color:var(--soft);}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,127,145,.14);}
textarea{resize:vertical;min-height:70px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.age-box{display:flex;align-items:center;justify-content:center;background:var(--pale);border-radius:12px;font-weight:700;color:var(--teal);min-height:46px;font-size:.95rem;text-align:center;padding:4px 8px;}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seg label{margin:0;cursor:pointer;}
.seg input{position:absolute;opacity:0;width:0;height:0;}
.seg span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:600;font-size:.92rem;background:#fff;}
.seg input:checked + span{border-color:var(--teal);background:var(--pale);color:var(--teal);}
.seg input:focus-visible + span{box-shadow:0 0 0 3px rgba(14,127,145,.25);}
button.send{width:100%;margin-top:6px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;background:linear-gradient(135deg,var(--gold),#E8BC63);color:#3a2a08;cursor:pointer;}
button.send:disabled{opacity:.6;cursor:default;}
.err{color:var(--err);font-size:.88rem;margin-top:10px;min-height:1.2em;text-align:center;}
.hp{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden;}
.done{text-align:center;padding:26px 8px;}
.done .tick{width:74px;height:74px;border-radius:50%;background:#E7F6EE;color:var(--ok);font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.done h2{font-family:'Tajawal',sans-serif;font-size:1.25rem;margin-bottom:6px;}
.done p{color:var(--soft);font-size:.95rem;}
.priv{font-size:.78rem;color:var(--soft);text-align:center;margin-top:12px;}
</style>
</head>

      </div>
      <div class="field"><label for="address">العنوان</label><textarea id="address" name="address" maxlength="200" autocomplete="street-address" required></textarea></div>
      <div class="field"><label for="nid">رقم البطاقة (الرقم القومي) <small>— 14 رقم، ممكن تسيبه فاضي للأطفال</small></label><input id="nid" name="nid" type="text" inputmode="numeric" maxlength="14" placeholder="٢٩٠٠٠٠٠٠٠٠٠٠٠٠"></div>
      <div class="field"><label>سبب الزيارة</label>
        <div class="seg">
          <label><input type="radio" name="visit" value="checkup" checked><span>كشف</span></label>
          <label><input type="radio" name="visit" value="followup"><span>متابعة علاج</span></label>
        </div>
      </div>
      <div class="hp" aria-hidden="true"><label>الموقع <input type="text" id="site" tabindex="-1" autocomplete="off"></label></div>
      <button class="send" id="sendBtn" type="submit">إرسال البيانات</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="priv">بياناتك بتوصل لفريق العيادة بس وبتتستخدم لتسجيل ملفك الطبي.</p>
  </div>

  <div class="card done" id="doneCard" style="display:none;">
    <div class="tick">✓</div>
    <h2>اتسجلت بياناتك</h2>
    <p>فريق العيادة هيراجعها ويكلمك على رقم <b id="doneNum"></b> عشان يأكد ويحدد لك الميعاد.</p>
    <p style="margin-top:10px;">تقدر تقفل الصفحة دلوقتي.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAXoB_WHtLStu0mr4dnZKG8YeXOn_R1dg4",
    authDomain: "abanoub-clinic.firebaseapp.com",
    projectId: "abanoub-clinic",
    storageBucket: "abanoub-clinic.firebasestorage.app",
    messagingSenderId: "904420382642",
    appId: "1:904420382642:web:2c048976c4d04e2d8436ab"
  };
  var db = null;
  try{ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  // أرقام عربية/هندية → إنجليزي
  function latin(s){
    return String(s || '').replace(/[٠-٩]/g, function(d){ return d.charCodeAt(0) - 0x0660; })
                          .replace(/[۰-۹]/g, function(d){ return d.charCodeAt(0) - 0x06F0; });
  }
  function digitsOnly(el){ el.value = latin(el.value).replace(/\D/g, ''); }
  $('phone').addEventListener('input', function(){ digitsOnly(this); });
  $('nid').addEventListener('input', function(){
    digitsOnly(this);
    // الرقم القومي بيحدد تاريخ الميلاد: رقم1 = القرن (2→1900، 3→2000) ثم YYMMDD
    var v = this.value;
    if(v.length >= 7 && !$('birth').value){
      var c = v.charAt(0) === '2' ? 1900 : v.charAt(0) === '3' ? 2000 : 0;
      if(c){
        var y = c + parseInt(v.substr(1, 2), 10), m = v.substr(3, 2), d = v.substr(5, 2);
        var iso = y + '-' + m + '-' + d;
        if(validDate(iso)){ $('birth').value = iso; showAge(); }
      }
    }
  });

  function todayLocal(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function validDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if(!m) return false;
    var y = +m[1], mo = +m[2], d = +m[3];
    var dt = new Date(y, mo - 1, d);
    if(dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return false;
    return y >= 1900 && dt <= todayLocal();
  }
  function ageParts(iso){
    var p = iso.split('-'), t = todayLocal();
    var y = t.getFullYear() - +p[0], mo = t.getMonth() + 1 - +p[1];
    if(t.getDate() < +p[2]) mo--;
    if(mo < 0){ y--; mo += 12; }
    return { y: y, m: mo };
  }
  function ageText(iso){
    var a = ageParts(iso);
    if(a.y < 1) return a.m + ' شهر';
    if(a.y < 3 && a.m) return a.y + ' سنة و ' + a.m + ' شهر';
    return a.y + ' سنة';
  }
  function showAge(){
    var v = $('birth').value;
    $('ageBox').textContent = validDate(v) ? ageText(v) : '—';
  }
  $('birth').max = todayLocal().getFullYear() + '-' + pad(todayLocal().getMonth() + 1) + '-' + pad(todayLocal().getDate());
  $('birth').addEventListener('input', showAge);
  $('birth').addEventListener('change', showAge);

  var COOLDOWN_KEY = 'clinicCheckinLast';
  function lastSent(){ try{ return +localStorage.getItem(COOLDOWN_KEY) || 0; }catch(e){ return 0; } }

  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var err = $('err'); err.textContent = '';
    if($('site').value) return; // honeypot
    var name = $('name').value.trim().replace(/\s+/g, ' ');
    var phone = latin($('phone').value).replace(/\D/g, '');
    var birth = $('birth').value;
    var gEl = document.querySelector('input[name="gender"]:checked');
    var address = $('address').value.trim();
    var nid = latin($('nid').value).replace(/\D/g, '');
    var visit = document.querySelector('input[name="visit"]:checked').value;

    if(name.length < 3){ err.textContent = 'اكتب الاسم بالكامل.'; $('name').focus(); return; }
    if(!/^01[0-9]{9}$/.test(phone)){ err.textContent = 'اكتب رقم موبايل مصري صحيح (11 رقم يبدأ بـ 01).'; $('phone').focus(); return; }
    if(!validDate(birth)){ err.textContent = 'اختار تاريخ ميلاد صحيح.'; $('birth').focus(); return; }
    if(!gEl){ err.textContent = 'اختار النوع (ذكر / أنثى).'; return; }
    if(address.length < 3){ err.textContent = 'اكتب العنوان.'; $('address').focus(); return; }
    if(nid && !/^[0-9]{14}$/.test(nid)){ err.textContent = 'رقم البطاقة لازم يكون 14 رقم، أو سيبه فاضي.'; $('nid').focus(); return; }
    if(Date.now() - lastSent() < 60000){ err.textContent = 'بياناتك اتبعتت قبل لحظات. استنى دقيقة لو عايز تبعت تاني.'; return; }
    if(!db){ err.textContent = 'مفيش اتصال بالسيستم دلوقتي. جرّب تاني بعد شوية.'; return; }

    var btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
    db.collection('checkins').add({
      name: name, phone: phone, birthDate: birth, gender: gEl.value, address: address,
      nationalId: nid, visitType: visit, status: 'pending', ts: Date.now()
    }).then(function(){
      try{ localStorage.setItem(COOLDOWN_KEY, String(Date.now())); }catch(e){}
      $('doneNum').textContent = phone;
      $('formCard').style.display = 'none';
      $('doneCard').style.display = 'block';
      window.scrollTo(0, 0);
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'إرسال البيانات';
      err.textContent = 'حصل خطأ في الإرسال. اتأكد من النت وجرّب تاني، ولو استمر كلّم الاستقبال.';
    });
  });
})();
</script>
</body>
</html>
